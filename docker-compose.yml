version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis-persona-local
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      - auth
      - persona
      - experiencias
    restart: unless-stopped

  persona:
    build:
      context: .
      dockerfile: persona/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: autenticacion/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  experiencias:
    build:
      context: .
      dockerfile: experiencias/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  estudios:
    build:
      context: .
      dockerfile: estudios/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cursos:
    build:
      context: .
      dockerfile: cursos/Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  projects:
    build:
      context: .
      dockerfile: projects/Dockerfile
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  skills:
    build:
      context: .
      dockerfile: skills/Dockerfile
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cvdbnico
      - SPRING_DATASOURCE_USERNAME=cvdbnicouser
      - SPRING_DATASOURCE_PASSWORD=Gardian@2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
