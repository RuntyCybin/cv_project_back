spring:
  application:
    name: autenticacion
  datasource:
    url: jdbc:postgresql://localhost:5432/cvdbnico
    username: cvdbnicouser
    password: Gardian@2
    driver-class-name: org.postgresql.Driver
    schema: cvdbnicoschema
  jpa:
    show-sqql: true
    open-in-view: false # buena práctica para APIs REST
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: cvdbnicoschema
  cache:
    type: redis
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8083
  servlet:
    context-path: /cv

app:
  title: Modulo de autenticacion
  jwt:
    secret: ${JWT_SECRET:clave-secreta-de-desarrollo-cambiar-en-produccion-256bits}
    expiration: 3600

resilience4j:
  circuitbreaker:
    instances:
      estudiosService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

logging:
  level:
    root: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
    io.github.resilience4j: DEBUG