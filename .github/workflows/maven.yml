name: Maven CI    

on:    
  push:    
    branches:    
      - main    

jobs:    
  build:    
    runs-on: ubuntu-latest    
    services:    
      postgres:    
        image: postgres:latest    
        env:    
          POSTGRES_DB: my_database    
          POSTGRES_USER: my_user    
          POSTGRES_PASSWORD: my_password    
        ports:    
          - 5432:5432    
        options: >    
          --health-cmd='pg_isready -U my_user'    
          --health-interval=10s    
          --health-timeout=5s    
          --health-retries=5    
    steps:    
      - name: Checkout code    
        uses: actions/checkout@v2    
      - name: Set up JDK    
        uses: actions/setup-java@v2    
        with:    
          java-version: '11'    
      - name: Build with Maven    
        run: mvn clean install
